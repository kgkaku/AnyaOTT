name: AynaOTT

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install requests
        run: pip install requests
      
      - name: Decode and run script
        env:
          AYNA_PY_B64: ${{ secrets.AYNA_PY }}
          AYNA_COOKIE: ${{ secrets.AYNA_COOKIE }}
        run: |
          echo "$AYNA_PY_B64" | base64 -d > script.py
          python script.py
      
      - name: Commit updates
        run: |
          git config user.name "refresh-ayna[bot]"
          git config user.email "refresh@ayna.kgkaku"
          git add *.json *.m3u 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Refresh AynaOTT channels [skip ci]" && git push)
